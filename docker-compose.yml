name: tiny-search-engine

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HOST: 0.0.0.0
      PORT: "5000"
      DEBUG: "false"
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      INDEX_PATH: /data/index.db
      MODEL_DIR: /data/models
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-52428800}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      MAX_FILES: ${MAX_FILES:-100}
      MAX_QUERY_LENGTH: ${MAX_QUERY_LENGTH:-500}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-120}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ENABLE_EMBEDDINGS: ${ENABLE_EMBEDDINGS:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      ENABLE_CRAWLER: ${ENABLE_CRAWLER:-false}
      CRAWLER_ALLOWED_DOMAINS: ${CRAWLER_ALLOWED_DOMAINS:-}
      BM25_K1: ${BM25_K1:-1.2}
      BM25_B: ${BM25_B:-0.75}
      RRF_K: ${RRF_K:-60}
    volumes:
      - backend_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    networks:
      - tse_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:5000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:5000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tse_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

volumes:
  backend_data:
    driver: local

networks:
  tse_network:
    driver: bridge
